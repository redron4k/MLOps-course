# Единственная точка конфигурации ДЗ 5. В src/ нет ни имени модели,
# ни learning rate, ни путей.
model:
  name: "Qwen/Qwen3-0.6B"
  device: "auto"            # auto | cpu | cuda | mps
  # Базовые веса в bfloat16: они заморожены, точность им не нужна, а память
  # и время уходят вдвое. Сами матрицы LoRA peft держит в float32 — там идут
  # крошечные обновления AdamW. На старом CPU без bf16 ставьте float32.
  dtype: "bfloat16"
  enable_thinking: false    # как в ДЗ 4: шаблон должен совпадать с обучением

data:
  # Выход стадии tokenize из ДЗ 4. У студента — свой путь.
  train: "data/tokenized/train.pt"
  val: "data/tokenized/val.pt"

lora:
  r: 8
  alpha: 16                 # итоговый масштаб апдейта alpha / r = 2
  dropout: 0.05
  # Только проекции внимания и MLP. embed_tokens и lm_head — это 155 млн
  # параметров каждый; в modules_to_save они уезжают в адаптер целиком.
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

train:
  seed: 42
  epochs: 1
  batch_size: 1
  grad_accum: 8             # эффективный батч = 8 при микробатче 1
  lr: 2.0e-4
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 1.0
  eval_every: 10            # шагов оптимизатора между замерами val loss
  # В ДЗ 4 окно 2048 токенов: оцениваем по одному примеру, чтобы логиты
  # на словарь 151 936 токенов помещались в память.
  eval_batch_size: 1
  gradient_checkpointing: true   # без него на ноутбуке с 16–32 ГБ не влезает
  max_steps: null           # null — по эпохам; число — обрезать (smoke-тесты)

# Эксперимент по слоям: второй прогон без адаптеров на первых N слоях.
variants:
  - name: "all_layers"
    freeze_first: 0
  - name: "freeze14"
    freeze_first: 14

compare:
  max_new_tokens: 160
  # Пять фиксированных промптов: одни и те же для базовой модели и адаптера.
  prompts:
    - "Проблема Android-разработки: Android Emulator not showing keys on keyboard\n\nAndroid Studio Emulator is showing black spots instead of keys on keyboard.\nAnyone knows whats the reason behind this?"
    - "Проблема Android-разработки: How to delete text msg at inbox in android studio from a special number?\n\nI have searched a lot but every method did not work\nwhat should I do?\ncan anyone here guide me?"
    - "Проблема Android-разработки: How to run unit tests for Generate Signed Bundle / APK action\n\nHow to automatically run unit tests before signing a bundle using \"Build -> Generate Signed Bundle\" action in Android Studio?"
    - "Проблема Android-разработки: Does android app bundle and proguard rules do the same optimization?\n\nIs there any difference between proguard rules optimization and app bundle optimization or is it same thing? Can any one explain how they are different?"
    - "Проблема Android-разработки: how to only display First 3 items in a spinner and other items by scrolling?\n\nSo i have a spinner as you can see in the image\nSo what i want to do is that i only want to display the first 3 items and rest items should be scroll-able. Any Ideas?"
  system: "Ты проводишь code review Android-приложения. Дай технически точное решение и укажи, почему оно работает."

paths:
  models: "models"
  metrics: "metrics"
  curves: "docs/curves.png"
  compare: "docs/compare.md"
