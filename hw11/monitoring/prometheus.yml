global:
  scrape_interval: 2s
  evaluation_interval: 2s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: inference
    kubernetes_sd_configs: [{role: pod, namespaces: {names: [hw11]}}]
    relabel_configs:
      - {source_labels: [__meta_kubernetes_pod_label_app], regex: api, action: keep}
      - {source_labels: [__meta_kubernetes_pod_container_port_number], regex: '8000', action: keep}
      - {source_labels: [__meta_kubernetes_pod_name], target_label: pod}
  - job_name: kube-state-metrics
    static_configs: [{targets: ['kube-state-metrics:8080']}]
  - job_name: cadvisor
    scheme: https
    authorization: {credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token}
    tls_config: {insecure_skip_verify: true}
    kubernetes_sd_configs: [{role: node}]
    metrics_path: /metrics/cadvisor
    relabel_configs:
      - {target_label: __address__, replacement: kubernetes.default.svc:443}
      - {source_labels: [__meta_kubernetes_node_name], target_label: __metrics_path__, replacement: '/api/v1/nodes/$1/proxy/metrics/cadvisor'}
