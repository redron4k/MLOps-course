name: Fast release checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hw8910
    env:
      PREFECT_SERVER_ANALYTICS_ENABLED: 'false'
      NO_PROXY: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-fast.lock.txt
      - run: make check PYTHON=python
      - run: make check-prefect PYTHON=python
