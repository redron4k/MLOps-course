# Единственная точка конфигурации ДЗ 3.

collect:
  # v1 — исходный период, v2 — тот же домен с расширенным периодом.
  version: "v1"
  site: "stackoverflow"
  n_rows: 1800
  per_tag_rows: 400
  timeout_seconds: 30
  versions:
    v1:
      n_rows: 1800
      from_date: "2020-01-01"
      to_date: "2023-12-31"
      tags: ["android", "kotlin", "jetpack-compose", "android-studio", "android-room", "androidx"]
    v2:
      n_rows: 2400
      from_date: "2020-01-01"
      to_date: "2025-12-31"
      tags: ["android", "kotlin", "jetpack-compose", "android-studio", "android-room", "androidx", "kotlin-coroutines", "android-gradle-plugin"]
  system_prompts:
    - "Ты Android-инженер поддержки. Объясни причину проблемы и предложи минимальное исправление."
    - "Ты проводишь code review Android-приложения. Дай технически точное решение и укажи, почему оно работает."
    - "Ты наставник по Kotlin и AndroidX. Помоги разработчику исправить проблему, сохраняя практический контекст."

clean:
  min_user_chars: 30
  max_user_chars: 4000
  min_assistant_chars: 2
  near_dup:
    enabled: true
    shingle_words: 4
    num_perm: 64
    threshold: 0.85
  pii:
    enabled: true

diversity:
  min_examples: 1000
  min_system_prompts: 3
  min_groups: 50
  max_group_share: 0.10
  min_answer_len_ratio: 1.6
  max_same_length_share: 0.25
  max_duplicate_answer_share: 0.30

split:
  group_key: "topic"
  ratios:
    train: 0.8
    val: 0.1
    test: 0.1
  seed: 42

contamination:
  threshold: 0.85

paths:
  raw: "data/raw.jsonl"
  clean: "data/clean.jsonl"
  train: "data/train.jsonl"
  val: "data/val.jsonl"
  test: "data/test.jsonl"
  metrics_collect: "metrics/collect.json"
  metrics_clean: "metrics/clean.json"
  metrics_split: "metrics/split.json"
  metrics_diversity: "metrics/diversity.json"
  datasheet: "docs/datasheet.md"
